name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pratosalvo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test do container
        run: |
          docker run -d --name app -p 3001:3001 pratosalvo:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3001/api/health && break
            if [ "$i" = 30 ]; then docker logs app; exit 1; fi
            sleep 1
          done
          test "$(docker exec app id -u)" != "0"
          node scripts/smoke.js http://127.0.0.1:3001 || { docker logs app; exit 1; }
